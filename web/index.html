<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelayPilot</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101820;color:#eaf2f6}body{max-width:900px;margin:32px auto;padding:0 18px}h1{margin-bottom:4px}small{color:#9db3c1}section{background:#192630;padding:20px;margin:18px 0;border-radius:12px}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #49606e;border-radius:6px;background:#101820;color:inherit;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#245c69}label{display:inline-block;margin:6px 8px 6px 0}textarea,pre{width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto}#status{color:#f2cb88;min-height:24px}.row{display:flex;gap:10px;flex-wrap:wrap}textarea{margin:12px 0;min-height:110px}
</style>
<h1>RelayPilot</h1><small>远程派任务，代码留在你的机器上。</small>
<section><label>访问 Token <input id="token" type="password" autocomplete="off"></label><button id="connect">连接 / 刷新设备</button><p><small>Token 仅保留在当前页面，刷新后需重新输入。</small></p><label>设备 <select id="device"></select></label><button id="refresh">刷新会话</button></section>
<section><div class="row"><label>项目 <input id="project" value="example"></label><label>Agent <select id="agent"><option>codex</option><option>claude</option></select></label><button id="create">创建会话</button></div><label>会话 <select id="session"></select></label><button id="logs">刷新输出</button><button id="stop">停止会话</button><pre id="output">选择会话查看输出</pre><textarea id="prompt" placeholder="输入任务或后续指令"></textarea><button id="send">发送指令</button><p><small>输出为手动刷新的终端快照。首次信任、登录及权限审批需在内网机器完成。</small></p></section><p id="status" role="status"></p>
<script>
const $=id=>document.getElementById(id);
async function api(path,method='GET',body){const r=await fetch('/api/'+path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
const base=()=>{if(!$('device').value)throw Error('请先选择设备');return 'machines/'+encodeURIComponent($('device').value)+'/sessions'};
const selected=()=>{if(!$('session').value)throw Error('请先选择会话');return base()+'/'+encodeURIComponent($('session').value)};
function options(el,items){const old=el.value;el.replaceChildren(...items.map(([value,label])=>{const o=document.createElement('option');o.value=value;o.textContent=label;return o}));if(items.some(i=>i[0]===old))el.value=old}
async function refresh(){options($('session'),(await api(base())).map(s=>[s.id,s.id]));}
function bind(id,fn){$(id).onclick=async()=>{$(id).disabled=true;$('status').textContent='处理中…';try{await fn();$('status').textContent='完成'}catch(e){$('status').textContent=e.message}finally{$(id).disabled=false}}}
bind('connect',async()=>{options($('device'),(await api('machines')).map(d=>[d.id,d.id+(d.online?' · 在线':' · 离线')]));if($('device').value)await refresh()});
bind('refresh',refresh);bind('create',async()=>{const s=await api(base(),'POST',{project:$('project').value,agent:$('agent').value});await refresh();$('session').value=s.id});
bind('logs',async()=>{$('output').textContent=(await api(selected()+'/logs')).text});
bind('send',async()=>{await api(selected()+'/send','POST',{message:$('prompt').value});$('prompt').value=''});
bind('stop',async()=>{if(confirm('停止会话将结束当前 Agent，是否继续？')){await api(selected(),'DELETE');await refresh();$('output').textContent='会话已停止'}});
$('device').onchange=()=>{$('session').replaceChildren();$('output').textContent='请刷新会话'};
</script></html>
